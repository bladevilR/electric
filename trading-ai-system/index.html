<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电力交易策略助手</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">电</div>
        <div>
          <strong>电力交易策略助手</strong>
          <span>价格预测与策略复核</span>
        </div>
      </div>

      <nav class="side-nav" id="sideNav"></nav>

      <section class="side-card">
        <span>本地试用版</span>
        <strong>先看数据，再看建议</strong>
        <p>只做辅助判断，不会自动提交交易。实时数据需要用户自己插 UKey 登录后采集。</p>
      </section>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="crumb">
          <span>当前位置</span>
          <strong id="moduleCrumb">今日工作台</strong>
        </div>
        <div class="top-actions">
          <label class="select-like">
            交易日
            <select id="dateSelect"></select>
          </label>
          <button class="ghost-button" id="refreshButton">刷新数据</button>
          <button class="primary-button" id="reportButton">生成建议报告</button>
        </div>
      </header>

      <section class="workspace" id="workspace"></section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
