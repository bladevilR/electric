<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>用户侧日前出清</title></head>
<body data-jspec-page="business">
  <label>交易日期 <input id="tradeDate" type="date" min="2026-05-01" max="2026-07-31" value="2026-07-30"></label>
  <button id="queryButton" type="button">查询</button>
  <p>查询日期：<output id="queryDate">2026-07-30</output></p>
  <table>
    <thead><tr><th>点位</th><th>时间</th><th>统一结算点电价最终结果</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>00:15</td><td>342.3</td></tr>
      <tr><td>2</td><td>00:30</td><td>350.1</td></tr>
      <tr><td>3</td><td>00:45</td><td>355.8</td></tr>
      <tr><td>4</td><td>01:00</td><td>349.6</td></tr>
    </tbody>
  </table>
  <script>
    queryButton.addEventListener('click', () => { queryDate.value = tradeDate.value; });
  </script>
</body>
</html>
