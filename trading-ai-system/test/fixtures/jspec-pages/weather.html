<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>气象预测</title></head>
<body data-jspec-page="business">
  <label>预报日期 <input id="tradeDate" type="date" min="2026-05-01" max="2026-07-31" value="2026-07-30"></label>
  <button id="queryButton" type="button">查询</button>
  <p>查询日期：<output id="queryDate">2026-07-30</output></p>
  <table>
    <thead><tr><th>点位</th><th>预测温度（℃）</th><th>实际温度（℃）</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>29.1</td><td>29.4</td></tr>
      <tr><td>2</td><td>29.0</td><td>29.2</td></tr>
      <tr><td>3</td><td>28.8</td><td>29.0</td></tr>
      <tr><td>4</td><td>28.7</td><td>28.9</td></tr>
    </tbody>
  </table>
  <script>
    queryButton.addEventListener('click', () => { queryDate.value = tradeDate.value; });
  </script>
</body>
</html>
